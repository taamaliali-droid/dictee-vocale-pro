<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Dictée Vocale Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263348;
  --border:#334155;--accent:#38bdf8;--accent2:#818cf8;
  --green:#34d399;--red:#f87171;--text:#f1f5f9;--muted:#94a3b8;
}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.logo{font-size:1.1rem;font-weight:700;color:var(--accent)}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:0.78rem;color:var(--text);outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:0.75rem;color:var(--muted);cursor:pointer;transition:all 0.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.green{border-color:rgba(52,211,153,0.4);color:var(--green)}
.btn.red{border-color:rgba(248,113,113,0.3);color:var(--red)}

/* MIC SECTION */
.mic-section{display:flex;flex-direction:column;align-items:center;padding:24px 16px 16px;gap:12px;background:var(--surface);border-bottom:1px solid var(--border)}
.mic-btn{width:80px;height:80px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s;font-size:2rem}
.mic-btn:hover{border-color:var(--accent);background:rgba(56,189,248,0.1)}
.mic-btn.listening{border-color:var(--red);background:rgba(248,113,113,0.15);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.3)}50%{box-shadow:0 0 0 16px rgba(248,113,113,0)}}
.status{font-size:0.78rem;color:var(--muted);text-align:center}
.status.on{color:var(--red)}

/* WAVEFORM */
.wave{display:flex;align-items:center;gap:3px;height:28px;opacity:0;transition:opacity 0.3s}
.wave.active{opacity:1}
.wave span{width:3px;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:2px;animation:wb 0.7s ease-in-out infinite}
.wave span:nth-child(1){animation-delay:0s}
.wave span:nth-child(2){animation-delay:0.1s}
.wave span:nth-child(3){animation-delay:0.2s}
.wave span:nth-child(4){animation-delay:0.15s}
.wave span:nth-child(5){animation-delay:0.05s}
@keyframes wb{0%,100%{height:4px}50%{height:22px}}

/* EDITOR */
.editor-wrap{flex:1;overflow-y:auto;padding:20px}
#editor{font-size:1.05rem;line-height:1.85;color:var(--text);min-height:200px;outline:none;white-space:pre-wrap;word-break:break-word}
#editor:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic;pointer-events:none}
.interim{color:var(--accent);opacity:0.7}

/* STATUSBAR */
.statusbar{padding:8px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);background:var(--surface)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:340px;max-width:90vw}
.modal h2{font-size:1.2rem;color:var(--accent);margin-bottom:8px}
.modal p{font-size:0.82rem;color:var(--muted);margin-bottom:16px}
.modal select{width:100%;margin-bottom:14px;padding:10px}
#translate-result{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;font-size:0.88rem;line-height:1.7;max-height:160px;overflow-y:auto}
.modal-btns{display:flex;gap:8px;margin-bottom:10px}
.btn-primary{flex:1;padding:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#0f172a;font-weight:700;font-size:0.82rem;cursor:pointer}
.btn-close{width:100%;padding:9px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.82rem;cursor:pointer}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:0.8rem;color:var(--text);opacity:0;transition:all 0.3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANDROID NOTICE */
.android-notice{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);border-radius:10px;padding:12px 16px;margin:16px;font-size:0.82rem;color:var(--accent);text-align:center;display:none}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">🎙️ Dictée Vocale Pro</div>
  <select id="lang-sel">
    <option value="fr-FR">🇫🇷 Français</option>
    <option value="en-US">🇺🇸 English</option>
    <option value="ar-SA">🇸🇦 العربية</option>
    <option value="es-ES">🇪🇸 Español</option>
    <option value="de-DE">🇩🇪 Deutsch</option>
    <option value="it-IT">🇮🇹 Italiano</option>
    <option value="pt-BR">🇧🇷 Português</option>
    <option value="ru-RU">🇷🇺 Русский</option>
    <option value="zh-CN">🇨🇳 中文</option>
    <option value="ja-JP">🇯🇵 日本語</option>
    <option value="ko-KR">🇰🇷 한국어</option>
    <option value="hi-IN">🇮🇳 हिन्दी</option>
    <option value="tr-TR">🇹🇷 Türkçe</option>
    <option value="nl-NL">🇳🇱 Nederlands</option>
    <option value="pl-PL">🇵🇱 Polski</option>
    <option value="uk-UA">🇺🇦 Українська</option>
    <option value="he-IL">🇮🇱 עברית</option>
    <option value="fa-IR">🇮🇷 فارسی</option>
    <option value="vi-VN">🇻🇳 Tiếng Việt</option>
    <option value="th-TH">🇹🇭 ภาษาไทย</option>
    <option value="id-ID">🇮🇩 Bahasa Indonesia</option>
    <option value="ms-MY">🇲🇾 Bahasa Melayu</option>
    <option value="sw-KE">🇰🇪 Kiswahili</option>
  </select>
  <div class="actions">
    <button class="btn" onclick="copyText()">📋 Copier</button>
    <button class="btn green" onclick="openTranslate()">🌍 Traduire</button>
    <button class="btn" onclick="exportTxt()">📤 Exporter</button>
    <button class="btn red" onclick="clearText()">🗑 Effacer</button>
  </div>
</div>

<!-- ANDROID NOTICE -->
<div class="android-notice" id="android-notice">
  📱 Sur Android : appuyez sur le micro puis parlez. Le texte apparaîtra automatiquement !
</div>

<!-- MIC SECTION -->
<div class="mic-section">
  <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Cliquez pour parler">
    🎤
  </button>
  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="status" id="status">Appuyez sur le micro pour commencer</div>
</div>

<!-- EDITOR -->
<div class="editor-wrap">
  <div id="editor" contenteditable="true" spellcheck="true"
    data-ph="Votre texte s'écrira ici pendant que vous parlez…"></div>
</div>

<!-- STATUSBAR -->
<div class="statusbar">
  <span id="wc">0 mot</span>
  <span id="time-display">--:--</span>
</div>

<!-- TRANSLATE MODAL -->
<div class="modal-bg" id="translate-bg" onclick="closeTranslateIfBg(event)">
  <div class="modal">
    <h2>🌍 Traduire</h2>
    <p>Choisissez la langue cible</p>
    <select id="translate-lang">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇺🇸 Anglais</option>
      <option value="ar">🇸🇦 Arabe</option>
      <option value="es">🇪🇸 Espagnol</option>
      <option value="de">🇩🇪 Allemand</option>
      <option value="it">🇮🇹 Italien</option>
      <option value="pt">🇧🇷 Portugais</option>
      <option value="ru">🇷🇺 Russe</option>
      <option value="zh">🇨🇳 Chinois</option>
      <option value="ja">🇯🇵 Japonais</option>
      <option value="tr">🇹🇷 Turc</option>
    </select>
    <div id="translate-result"></div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="doTranslate()" id="translate-btn">🌍 Traduire</button>
      <button class="btn" onclick="copyTranslation()" id="copy-trans-btn" style="display:none">📋 Copier</button>
    </div>
    <button class="btn-close" onclick="closeTranslate()">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DETECTION ANDROID ─────────────────────────────────
const isAndroid = /Android/i.test(navigator.userAgent);
const isWebView = /wv|WebView/i.test(navigator.userAgent) || 
                  (isAndroid && /Version\/\d/.test(navigator.userAgent));

if (isAndroid) {
  document.getElementById('android-notice').style.display = 'block';
}

// ─── SPEECH RECOGNITION SETUP ──────────────────────────
const SR = window.SpeechRecognition || 
           window.webkitSpeechRecognition || 
           window.MediaStreamTrackProcessor ||
           null;

let recognition = null;
let isListening = false;
let finalText = '';

// ─── CLOCK ─────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('time-display').textContent = 
    now.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

// ─── MIC TOGGLE ────────────────────────────────────────
function toggleMic() {
  if (!SR) {
    // Android WebView fallback - show keyboard input
    showAndroidFallback();
    return;
  }
  isListening ? stopListening() : startListening();
}

function showAndroidFallback() {
  toast('💡 Sur Android : utilisez le clavier vocal de votre téléphone. Appuyez sur 🎤 sur le clavier !');
  // Try to focus the editor so keyboard appears
  const editor = document.getElementById('editor');
  editor.focus();
  // Show instruction
  document.getElementById('status').textContent = 'Utilisez le micro 🎤 de votre clavier Android !';
}

function buildRec() {
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = document.getElementById('lang-sel').value;

  r.onstart = () => {
    isListening = true;
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('wave').classList.add('active');
    document.getElementById('status').textContent = 'Écoute en cours — Parlez !';
    document.getElementById('status').classList.add('on');
  };

  r.onend = () => { if (isListening) { try { r.start(); } catch(e) {} } };

  r.onerror = (e) => {
    console.log('Speech error:', e.error);
    if (e.error === 'not-allowed') {
      toast('🎤 Microphone non autorisé — vérifiez les permissions');
      stopListening();
    } else if (e.error === 'service-not-allowed' || e.error === 'network') {
      toast('💡 Utilisez le micro 🎤 de votre clavier Android !');
      stopListening();
      document.getElementById('editor').focus();
    }
  };

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' ';
      else interim += t;
    }
    render(interim);
    updateStats();
  };
  return r;
}

function startListening() {
  try {
    recognition = buildRec();
    isListening = true;
    recognition.start();
  } catch(e) {
    showAndroidFallback();
  }
}

function stopListening() {
  isListening = false;
  if (recognition) { try { recognition.stop(); } catch(e) {} }
  document.getElementById('mic-btn').classList.remove('listening');
  document.getElementById('wave').classList.remove('active');
  document.getElementById('status').textContent = 'Appuyez sur le micro pour recommencer';
  document.getElementById('status').classList.remove('on');
  render('');
}

function render(interim) {
  const editor = document.getElementById('editor');
  editor.innerHTML = '';
  if (finalText) editor.appendChild(document.createTextNode(finalText));
  if (interim) {
    const s = document.createElement('span');
    s.className = 'interim';
    s.textContent = interim;
    editor.appendChild(s);
  }
}

// ─── EDITOR INPUT ───────────────────────────────────────
document.getElementById('editor').addEventListener('input', () => {
  finalText = document.getElementById('editor').textContent;
  updateStats();
});

function updateStats() {
  const text = getPlainText().trim();
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  document.getElementById('wc').textContent = `${words} mot${words !== 1 ? 's' : ''}`;
}

function getPlainText() {
  return document.getElementById('editor').textContent || '';
}

// ─── ACTIONS ───────────────────────────────────────────
function copyText() {
  const text = getPlainText().trim();
  if (!text) { toast('Rien à copier'); return; }
  navigator.clipboard.writeText(text)
    .then(() => toast('📋 Texte copié !'))
    .catch(() => {
      // Fallback for Android
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('📋 Texte copié !');
    });
}

function clearText() {
  if (!getPlainText().trim()) return;
  stopListening();
  finalText = '';
  document.getElementById('editor').innerHTML = '';
  updateStats();
  toast('🗑 Texte effacé');
}

function exportTxt() {
  const text = getPlainText().trim();
  if (!text) { toast('Rien à exporter'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  a.download = 'dictee.txt';
  a.click();
  toast('📄 Fichier téléchargé !');
}

// ─── TRANSLATION ────────────────────────────────────────
let lastTranslation = '';

function openTranslate() {
  const text = getPlainText().trim();
  if (!text) { toast('Rien à traduire'); return; }
  document.getElementById('translate-result').style.display = 'none';
  document.getElementById('copy-trans-btn').style.display = 'none';
  document.getElementById('translate-bg').classList.add('open');
}

function closeTranslate() {
  document.getElementById('translate-bg').classList.remove('open');
}

function closeTranslateIfBg(e) {
  if (e.target === document.getElementById('translate-bg')) closeTranslate();
}

async function doTranslate() {
  const text = getPlainText().trim();
  const lang = document.getElementById('translate-lang').value;
  const btn = document.getElementById('translate-btn');
  const resultEl = document.getElementById('translate-result');
  if (!text) { toast('Rien à traduire'); return; }
  btn.textContent = '⏳ En cours…';
  btn.disabled = true;
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,500))}&langpair=auto|${lang}`);
    const data = await res.json();
    if (data.responseStatus === 200) {
      lastTranslation = data.responseData.translatedText;
      resultEl.textContent = lastTranslation;
      resultEl.style.display = 'block';
      document.getElementById('copy-trans-btn').style.display = 'flex';
      toast('✅ Traduction terminée !');
    } else { toast('❌ Erreur de traduction'); }
  } catch { toast('❌ Erreur réseau'); }
  btn.textContent = '🌍 Traduire';
  btn.disabled = false;
}

function copyTranslation() {
  if (!lastTranslation) return;
  navigator.clipboard.writeText(lastTranslation)
    .then(() => toast('📋 Traduction copiée !'))
    .catch(() => toast('Erreur'));
}

// ─── TOAST ──────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── LANG CHANGE ────────────────────────────────────────
document.getElementById('lang-sel').addEventListener('change', () => {
  if (isListening) { stopListening(); setTimeout(startListening, 200); }
});

// ─── KEYBOARD SHORTCUT ──────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) {
    copyText();
  }
});

updateStats();
</script>
</body>
</html>
