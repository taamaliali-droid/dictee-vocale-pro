<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Dictée Vocale Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#263348;
  --border:#334155;--accent:#38bdf8;--green:#34d399;
  --red:#f87171;--text:#f1f5f9;--muted:#94a3b8;
}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.logo{font-size:1rem;font-weight:700;color:var(--accent);white-space:nowrap}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:0.75rem;color:var(--text);outline:none;max-width:140px}

.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.73rem;color:var(--muted);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.btn:active{transform:scale(0.96)}
.btn.green{border-color:rgba(52,211,153,0.4);color:var(--green)}
.btn.red{border-color:rgba(248,113,113,0.3);color:var(--red)}
.btn.accent{border-color:rgba(56,189,248,0.4);color:var(--accent)}

/* BIG MIC AREA — opens keyboard + tells user exactly where to tap */
.mic-zone{margin:16px;border:2px solid var(--accent);border-radius:16px;background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(129,140,248,0.06));padding:18px;text-align:center;cursor:pointer;transition:all 0.2s}
.mic-zone:active{transform:scale(0.98)}
.mic-zone .big-icon{font-size:2.4rem;margin-bottom:6px}
.mic-zone h3{font-size:0.95rem;color:var(--accent);margin-bottom:4px}
.mic-zone p{font-size:0.78rem;color:var(--muted);line-height:1.5}

.editor-section{flex:1;display:flex;flex-direction:column;padding:0 16px 16px}
#editor{
  flex:1;min-height:240px;background:var(--surface);
  border:2px solid var(--border);border-radius:12px;padding:16px;
  font-size:1.05rem;line-height:1.8;color:var(--text);
  resize:none;outline:none;font-family:inherit;
  transition:border-color 0.2s;width:100%;
}
#editor:focus{border-color:var(--accent)}
#editor::placeholder{color:var(--muted);font-style:italic}

.statusbar{padding:8px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);background:var(--surface)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:360px}
.modal h2{font-size:1.1rem;color:var(--accent);margin-bottom:6px}
.modal p{font-size:0.8rem;color:var(--muted);margin-bottom:14px}
.modal select{width:100%;margin-bottom:12px;padding:10px;font-size:0.85rem}
#translate-result{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;font-size:0.85rem;line-height:1.7;max-height:180px;overflow-y:auto;color:var(--text)}
.modal-btns{display:flex;gap:8px;margin-bottom:10px}
.btn-primary{flex:1;padding:11px;background:linear-gradient(135deg,var(--accent),#818cf8);border:none;border-radius:10px;color:#0f172a;font-weight:700;font-size:0.82rem;cursor:pointer}
.btn-close{width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:0.82rem;cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:0.8rem;color:var(--text);opacity:0;transition:all 0.3s;pointer-events:none;z-index:200;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🎙️ Dictée Vocale Pro</div>
  <select id="lang-sel">
    <option value="fr-FR">🇫🇷 Français</option>
    <option value="en-US">🇺🇸 English</option>
    <option value="ar-SA">🇸🇦 العربية</option>
    <option value="es-ES">🇪🇸 Español</option>
    <option value="de-DE">🇩🇪 Deutsch</option>
    <option value="it-IT">🇮🇹 Italiano</option>
    <option value="pt-BR">🇧🇷 Português</option>
    <option value="ru-RU">🇷🇺 Русский</option>
    <option value="zh-CN">🇨🇳 中文</option>
    <option value="ja-JP">🇯🇵 日本語</option>
    <option value="tr-TR">🇹🇷 Türkçe</option>
  </select>
  <div class="actions">
    <button class="btn accent" onclick="openTranslate()">🌍 Traduire</button>
    <button class="btn" onclick="copyText()">📋 Copier</button>
    <button class="btn" onclick="exportTxt()">📤 Exporter</button>
    <button class="btn red" onclick="clearText()">🗑</button>
  </div>
</div>

<div class="mic-zone" onclick="focusEditor()">
  <div class="big-icon">🎤</div>
  <h3>Appuyez ici pour dicter</h3>
  <p>Le clavier va s'ouvrir → appuyez sur le micro 🎤 du clavier → parlez normalement</p>
</div>

<div class="editor-section">
  <textarea id="editor" placeholder="Votre texte apparaîtra ici..." oninput="updateStats()"></textarea>
</div>

<div class="statusbar">
  <span id="wc">0 mot</span>
  <span id="time-display">--:--</span>
</div>

<div class="modal-bg" id="translate-bg" onclick="closeTranslateIfBg(event)">
  <div class="modal">
    <h2>🌍 Traduire</h2>
    <p>Choisissez la langue cible pour la traduction</p>
    <select id="translate-lang">
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇺🇸 Anglais</option>
      <option value="ar">🇸🇦 Arabe</option>
      <option value="es">🇪🇸 Espagnol</option>
      <option value="de">🇩🇪 Allemand</option>
      <option value="it">🇮🇹 Italien</option>
      <option value="pt">🇧🇷 Portugais</option>
      <option value="ru">🇷🇺 Russe</option>
      <option value="zh">🇨🇳 Chinois</option>
      <option value="ja">🇯🇵 Japonais</option>
      <option value="tr">🇹🇷 Turc</option>
    </select>
    <div id="translate-result"></div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="doTranslate()" id="translate-btn">🌍 Traduire</button>
      <button class="btn accent" onclick="copyTranslation()" id="copy-trans-btn" style="display:none">📋 Copier</button>
    </div>
    <button class="btn-close" onclick="closeTranslate()">✕ Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function updateClock(){
  const n=new Date();
  document.getElementById('time-display').textContent=
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

function focusEditor(){
  const ed=document.getElementById('editor');
  ed.focus();
  ed.scrollIntoView({behavior:'smooth',block:'center'});
}

function updateStats(){
  const text=document.getElementById('editor').value.trim();
  const words=text?text.split(/\s+/).filter(Boolean).length:0;
  document.getElementById('wc').textContent=`${words} mot${words!==1?'s':''}`;
}

function copyText(){
  const text=document.getElementById('editor').value.trim();
  if(!text){toast('Rien à copier');return;}
  if(navigator.clipboard){
    navigator.clipboard.writeText(text)
      .then(()=>toast('📋 Texte copié !'))
      .catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('📋 Texte copié !');}
  catch(e){toast('❌ Erreur copie');}
  document.body.removeChild(ta);
}

function clearText(){
  if(!document.getElementById('editor').value.trim())return;
  document.getElementById('editor').value='';
  updateStats();
  toast('🗑 Texte effacé');
}

function exportTxt(){
  const text=document.getElementById('editor').value.trim();
  if(!text){toast('Rien à exporter');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
  a.download='dictee_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
  toast('📄 Fichier exporté !');
}

let lastTranslation='';

function openTranslate(){
  const text=document.getElementById('editor').value.trim();
  if(!text){toast('Écrivez du texte d\'abord !');return;}
  document.getElementById('translate-result').style.display='none';
  document.getElementById('copy-trans-btn').style.display='none';
  document.getElementById('translate-bg').classList.add('open');
}

function closeTranslate(){
  document.getElementById('translate-bg').classList.remove('open');
}

function closeTranslateIfBg(e){
  if(e.target===document.getElementById('translate-bg'))closeTranslate();
}

async function doTranslate(){
  const text=document.getElementById('editor').value.trim();
  const lang=document.getElementById('translate-lang').value;
  const btn=document.getElementById('translate-btn');
  const resultEl=document.getElementById('translate-result');
  if(!text){toast('Rien à traduire');return;}
  btn.textContent='⏳ En cours…';btn.disabled=true;
  try{
    const srcLang=document.getElementById('lang-sel').value.slice(0,2);
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0,500))}&langpair=${srcLang}|${lang}`;
    const res=await fetch(url);
    const data=await res.json();
    if(data.responseStatus===200){
      lastTranslation=data.responseData.translatedText;
      resultEl.textContent=lastTranslation;
      resultEl.style.display='block';
      document.getElementById('copy-trans-btn').style.display='flex';
      toast('✅ Traduction terminée !');
    } else {
      resultEl.textContent='❌ Erreur : '+data.responseDetails;
      resultEl.style.display='block';
    }
  } catch(e){
    resultEl.textContent='❌ Erreur réseau. Vérifiez votre connexion.';
    resultEl.style.display='block';
  }
  btn.textContent='🌍 Traduire';btn.disabled=false;
}

function copyTranslation(){
  if(!lastTranslation)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(lastTranslation).then(()=>toast('📋 Traduction copiée !'));
  } else { fallbackCopy(lastTranslation); }
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
}

updateStats();
</script>
</body>
</html>
